    file: "university-physics-volume-1.pdf"
    licence: "CC BY-NC-SA 4.0"
    attribution: >
      Ling, Sanny, Moebs et al., University Physics Volume 1, OpenStax, Rice University.
      Access for free at https://openstax.org/details/books/university-physics-volume-1
    # Chapters ingested (book chapter numbers). Page ranges are found from the PDF outline at ingest time.
    chapters: [3, 5, 6, 7]

