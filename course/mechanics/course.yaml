# Course pack: Introductory Mechanics (kinematics -> Newton's laws -> work and energy)
# Every source is openly licensed. `pramana fetch` downloads them into data/raw/<course>/;
# nothing here is redistributed in the repository.
id: mechanics
title: "Introductory Mechanics"
description: >
  Kinematics in one dimension, Newton's laws and their applications, work and kinetic energy.
  Textbook: OpenStax University Physics Volume 1. Slides: Collin College PHYS 2425.
  Lecture videos: MIT OpenCourseWare 8.01SC Classical Mechanics (Fall 2016).

sources:
