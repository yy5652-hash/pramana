[project]
name = "pramana"
version = "0.1.0"
description = "A source-grounded study companion: every answer opens the exact page, slide or second it came from."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "numpy>=1.26",
  "pillow>=10",
  "pypdfium2>=4.30",
  "python-pptx>=1.0",
  "faster-whisper>=1.1",
  "av<16",  # faster-whisper 1.2 still passes an argument PyAV 16 removed
  "fastembed>=0.5",
  "pyyaml>=6",
  "python-multipart>=0.0.9",
  "kokoro-onnx>=0.4",  # the narrator of the lesson films; its model is fetched on first use
]

[project.optional-dependencies]
eval = ["ragas>=0.4,<0.5", "langchain-community>=0.3,<0.4", "langchain-openai", "datasets>=2.20", "matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
pramana = "pramana.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pramana"]

[tool.pytest.ini_options]
testpaths = ["tests"]
